<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1240"/>
      <stop offset="0.55" stop-color="#4B22C9"/>
      <stop offset="1" stop-color="#FF4F7B"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="iris" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5CE1FF"/>
      <stop offset="1" stop-color="#7B5CFF"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="0" fill="url(#bg)"/>
  <rect width="512" height="512" rx="0" fill="url(#shine)"/>
  <g transform="translate(256 256) scale(1.0) translate(-256 -256)">
    <!-- Auge -->
    <path d="M76 256 C 140 150, 372 150, 436 256 C 372 362, 140 362, 76 256 Z"
          fill="#0E0A26" fill-opacity="0.35" stroke="#fff" stroke-width="26" stroke-linejoin="round" filter="url(#glow)"/>
    <!-- Iris -->
    <circle cx="256" cy="256" r="62" fill="url(#iris)"/>
    <!-- Download-Pfeil als Pupille -->
    <g fill="none" stroke="#fff" stroke-width="19" stroke-linecap="round" stroke-linejoin="round">
      <path d="M256 222 V 286"/>
      <path d="M229 260 L256 287 L283 260"/>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>