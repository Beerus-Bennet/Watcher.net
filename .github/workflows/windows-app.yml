name: Windows-App bauen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Jeden Montag neu bauen, damit immer das neueste yt-dlp drin ist
    - cron: "0 5 * * 1"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pakete installieren
        run: |
          python -m pip install --upgrade pip
          pip install -U -r requirements.txt pyinstaller

      - name: ffmpeg herunterladen
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip"
          Invoke-WebRequest $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-dl
          New-Item -ItemType Directory -Force ffmpeg | Out-Null
          Copy-Item ffmpeg-dl\*\bin\* ffmpeg\
          .\ffmpeg\ffmpeg.exe -hide_banner -encoders | Select-String mp3lame

      - name: Watcher.exe bauen
        run: >
          pyinstaller --noconfirm --onefile --name Watcher
          --icon packaging/watcher.ico
          --add-data "templates;templates"
          --add-data "static;static"
          --add-binary "ffmpeg/*;ffmpeg"
          --collect-submodules yt_dlp
          app.py

      - name: Kurztest (startet die App und ruft die Seite auf)
        shell: pwsh
        run: |
          $p = Start-Process dist\Watcher.exe -PassThru
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep 2
            try { $r = Invoke-WebRequest http://127.0.0.1:5000 -UseBasicParsing; if ($r.Content -match "Watcher.net") { $ok = $true; break } } catch {}
          }
          $r2 = Invoke-WebRequest http://127.0.0.1:5000/api/download -Method Post -ContentType "application/json" -Body '{"url":"https://www.netflix.com/title/1"}' -SkipHttpErrorCheck
          Stop-Process $p -Force
          if (-not $ok) { throw "App hat nicht gestartet" }
          if ($r2.Content -notmatch "DRM") { throw "API antwortet nicht wie erwartet: $($r2.Content)" }

      - uses: actions/upload-artifact@v4
        with:
          name: Watcher-Windows
          path: dist/Watcher.exe

      - name: Als Download veroeffentlichen
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Watcher.net fuer Windows (Version ${{ github.run_number }})
          make_latest: true
          files: dist/Watcher.exe
          body: |
            **Watcher.exe** herunterladen und doppelklicken. Nichts weiter installieren.
            Windows warnt beim ersten Start evtl. ("Der Computer wurde durch Windows geschuetzt"): auf **Weitere Informationen** und dann **Trotzdem ausfuehren** klicken.
